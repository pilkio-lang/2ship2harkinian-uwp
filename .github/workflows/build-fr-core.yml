name: build-fr-xbox-uwp

on:
  push:
    branches:
      - fr-game-runtime-v2
  workflow_dispatch:

jobs:
  build-fr-uwp:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout exact FR branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply UWP writable-path and crash-safety patch
        shell: pwsh
        run: |
          git -C libultraship apply --check ..\patches\libultraship-uwp-writable-paths.patch
          git -C libultraship apply ..\patches\libultraship-uwp-writable-paths.patch
          Write-Host "libultraship UWP writable-path and crash-safety patch applied."

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure UWP-compatible core
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          cmake -S . -B build_vanilla -G "Visual Studio 17 2022" -T v143 -A x64 -DCMAKE_BUILD_TYPE:STRING=Release

      - name: Apply UWP ZAPD patch before compiling ZAPD
        shell: pwsh
        run: |
          cmake --build build_vanilla --config Release --target ApplyUwpPatches
          $zapdMain = "ZAPDTR\ZAPD\Main.cpp"
          $patched = Select-String -Path $zapdMain -Pattern "SetZapdProgressCallback" -SimpleMatch
          if (-not $patched) {
            throw "The UWP ZAPD progress-callback patch was not applied before ZAPD compilation."
          }
          Write-Host "UWP ZAPD patch confirmed."

      - name: Generate 2ship.o2r
        shell: pwsh
        run: |
          cmake --build build_vanilla --config Release --target Generate2ShipOtr --parallel 8
          if (-not (Test-Path "2ship.o2r")) {
            throw "2ship.o2r was not generated at repository root."
          }
          Get-Item "2ship.o2r" | Format-List FullName, Length

      - name: Build French 2ship core
        shell: pwsh
        run: |
          cmake --build build_vanilla --config Release --target 2ship --parallel 8

      - name: Verify core outputs for UWP project
        shell: pwsh
        run: |
          $coreDir = Join-Path $env:GITHUB_WORKSPACE "x64\Release"
          $dll = Join-Path $coreDir "2ship.dll"
          $lib = Join-Path $coreDir "2ship.lib"
          $pdb = Join-Path $coreDir "2ship.pdb"

          if (-not (Test-Path $dll)) { throw "Expected core DLL is missing: $dll" }
          if (-not (Test-Path $lib)) { throw "Expected import library is missing: $lib" }

          Write-Host "CMake placed the core exactly where the UWP project expects it:"
          Get-Item $dll, $lib | Format-Table FullName, Length
          if (Test-Path $pdb) { Get-Item $pdb | Format-Table FullName, Length }

          $exports = & dumpbin /exports $dll
          $exports | Select-String "SetZapdProgressCallback"
          if (-not ($exports -match "SetZapdProgressCallback")) {
            throw "2ship.dll does not export SetZapdProgressCallback; ZAPD patch/linking failed."
          }
          Write-Host "SetZapdProgressCallback export confirmed."

          $uwpDeps = Join-Path $env:GITHUB_WORKSPACE "build_vanilla\_deps\uwplibs-src\x64"
          if (-not (Test-Path $uwpDeps)) {
            throw "UWP dependency tree was not generated: $uwpDeps"
          }
          Write-Host "UWP dependency tree: $uwpDeps"

      - name: Prepare UWP project for CI packaging
        shell: pwsh
        run: |
          $project = "vs2022-uwp\uwp\uwp.vcxproj"
          $xml = Get-Content $project -Raw
          $xml = $xml -replace '<AppxPackageSigningEnabled>True</AppxPackageSigningEnabled>', '<AppxPackageSigningEnabled>False</AppxPackageSigningEnabled>'
          $xml = $xml -replace '(?m)^\s*<PackageCertificateKeyFile>.*?</PackageCertificateKeyFile>\s*$', ''
          $xml = $xml -replace '(?m)^\s*<Content Include="(?:recomp|uwp)_TemporaryKey\.pfx" />\s*$', ''
          Set-Content -Path $project -Value $xml -Encoding UTF8

      - name: Build x64 UWP package
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "vs2022-uwp\uwp\uwp.vcxproj"
          $solutionDir = (Join-Path $env:GITHUB_WORKSPACE "vs2022-uwp") + "\"

          msbuild $project /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solutionDir" /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false

      - name: Stage UWP build artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "fr-uwp-artifact"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $packages = Get-ChildItem -Path "vs2022-uwp" -Recurse -File |
            Where-Object { $_.Extension -in @(".msixbundle", ".appxbundle", ".msix", ".appx") }

          if (-not $packages) {
            Write-Host "No packaged UWP file was found. Candidate output files:"
            Get-ChildItem -Path "vs2022-uwp" -Recurse -File |
              Where-Object { $_.FullName -match "\\(x64|AppPackages|Release)\\" } |
              Select-Object -First 200 FullName, Length
            throw "The UWP project compiled but did not produce an AppX/MSIX package."
          }

          foreach ($package in $packages) {
            Copy-Item $package.FullName (Join-Path $stage $package.Name) -Force
          }

          Copy-Item "x64\Release\2ship.dll" (Join-Path $stage "2ship.dll") -Force
          Copy-Item "x64\Release\2ship.lib" (Join-Path $stage "2ship.lib") -Force
          Copy-Item "2ship.o2r" (Join-Path $stage "2ship.o2r") -Force

          @(
            "Branch: ${{ github.ref_name }}"
            "Commit: ${{ github.sha }}"
            "Baseline: 0e1966ffbdc5baafb3689894d73f5c469bdd0a62"
            "Package version: 0.1.0.3"
            "Target: Xbox / UWP x64"
            "Build package is staged unsigned, then signed by CI with the included development certificate."
            "Runtime ROM remains NTSC-U. No ROM is included."
          ) | Set-Content -Encoding UTF8 (Join-Path $stage "BUILD_INFO.txt")

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Sign Xbox sideload packages
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "fr-uwp-artifact"
          $publisher = "CN=SternXD"

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -FriendlyName "2Ship FR Xbox Dev Signing" `
            -NotAfter (Get-Date).AddYears(2)

          if (-not $cert) {
            throw "Failed to create the Xbox sideload signing certificate."
          }

          $cerPath = Join-Path $stage "2ship-fr-dev-cert.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath -Force | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool -or -not (Test-Path $signtool)) {
            throw "signtool.exe was not found."
          }

          $appPackages = Get-ChildItem $stage -File |
            Where-Object {
              $_.Name -like "2ship2harkinian_*" -and
              $_.Extension -in @(".msix", ".msixbundle", ".appx", ".appxbundle")
            }

          if (-not $appPackages) {
            throw "No 2Ship MSIX/AppX package was found in the staging directory."
          }

          foreach ($package in $appPackages) {
            Write-Host "Signing $($package.Name)"
            & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /s My $package.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($package.Name)."
            }

            $signature = Get-AuthenticodeSignature -FilePath $package.FullName
            if (-not $signature.SignerCertificate) {
              throw "No Authenticode signer certificate found on $($package.Name)."
            }
            if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Unexpected signing certificate on $($package.Name). Expected $($cert.Thumbprint), got $($signature.SignerCertificate.Thumbprint)."
            }
            Write-Host "Signature certificate confirmed on $($package.Name): $($signature.SignerCertificate.Subject) / $($signature.SignerCertificate.Thumbprint)"
            Write-Host "Authenticode trust status on ephemeral CI runner: $($signature.Status)"
          }

          @(
            "2Ship2Harkinian FR - Xbox Dev Mode installation"
            ""
            "Package: 2ship2harkinian_0.1.0.3_x64.msixbundle"
            "Certificate: 2ship-fr-dev-cert.cer"
            "Dependency if requested: Microsoft.VCLibs.x64.14.00.appx"
            ""
            "1. Keep the existing D:\2ship / E:\2ship user data, ROM, O2R, mods and saves untouched."
            "2. Open Xbox Device Portal in Dev Mode and go to the app deployment page."
            "3. Select the x64 MSIX bundle as the application package."
            "4. Select 2ship-fr-dev-cert.cer as the signing certificate."
            "5. Add Microsoft.VCLibs.x64.14.00.appx only if the portal requests the VC runtime dependency."
            "6. Do not use the ARM, ARM64 or x86 VCLibs packages for this Xbox x64 build."
            "7. Install 0.1.0.3 as an update over the existing SternXD package; do not uninstall first."
            "8. If Device Portal refuses the update, do NOT uninstall the old package yet; preserve the exact error for diagnosis."
            ""
            "Signing publisher: $publisher"
            "Certificate thumbprint: $($cert.Thumbprint)"
            "Runtime ROM remains NTSC-U. No ROM is included."
          ) | Set-Content -Encoding UTF8 (Join-Path $stage "INSTALL_XBOX.txt")

          Add-Content -Encoding UTF8 (Join-Path $stage "BUILD_INFO.txt") @(
            "Signing publisher: $publisher"
            "Signing certificate thumbprint: $($cert.Thumbprint)"
            "Signing certificate file: 2ship-fr-dev-cert.cer"
          )

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload French Xbox UWP build
        uses: actions/upload-artifact@v4
        with:
          name: 2ship-fr-xbox-uwp-0.1.0.3
          path: fr-uwp-artifact
          retention-days: 7
