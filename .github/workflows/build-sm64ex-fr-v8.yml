name: Build SM64 NTSC-FR v8

on:
  push:
    branches:
      - chatgpt-sm64ex-fr-v8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-sm64ex-fr-v8

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang

      - name: Record MSYS2 root
        shell: msys2 {0}
        run: |
          root="$(cygpath -w / | tr '\\' '/')"
          echo "SM64EX_MSYS2_ROOT=$root" >> "$GITHUB_ENV"

      - name: Fetch pinned source and apply French v8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone https://github.com/caorthann-celt/sm64ex-uwp.git sm64ex-src
          if ($LASTEXITCODE -ne 0) { throw "Clone failed." }
          Set-Location sm64ex-src
          git checkout a0b33a006b0204d8fc837fa760a19135148c96bc
          if ($LASTEXITCODE -ne 0) { throw "Pinned checkout failed." }

          python "$env:GITHUB_WORKSPACE\ci\apply-sm64ex-fr-v8.py" "$PWD"
          if ($LASTEXITCODE -ne 0) { throw "v8 transform failed." }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed." }

          if (-not (Select-String -Path "src\pc\gfx\gfx_pc.c" -Pattern 'load_builtin_fr_texture' -Quiet)) {
            throw "Embedded glyph loader missing."
          }
          if (-not (Select-String -Path "src\game\ingame_menu.c" -Pattern '__sm64ex_fr_accent_acute' -Quiet)) {
            throw "Embedded accent key missing."
          }
          if (-not (Select-String -Path "src\menu\file_select.c" -Pattern 'print_hud_lut_string\(HUD_LUT_GLOBAL, x, y, LANGUAGE_ARRAY\(textNew\)\);' -Quiet)) {
            throw "VIDE is not using the original NEW path."
          }

      - name: Build text converter
        shell: msys2 {0}
        working-directory: sm64ex-src
        run: |
          make -C tools textconv
          test -f tools/textconv.exe || cp tools/textconv tools/textconv.exe

      - name: Install SDL2 UWP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg" }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          & "$env:VCPKG_ROOT\vcpkg.exe" install sdl2:x64-uwp
          if ($LASTEXITCODE -ne 0) { throw "SDL2 install failed." }
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build UWP DLL and package
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -app_platform=UWP
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=C:\vcpkg"
          cd /d "%GITHUB_WORKSPACE%\sm64ex-src\ports\uwp"
          cmake --preset uwp-game-dll-release -DSM64EX_MSYS2_ROOT="%SM64EX_MSYS2_ROOT%" -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DSM64EX_VCPKG_ROOT="C:/vcpkg" -DSM64EX_SDL2_ROOT="C:/vcpkg/installed/x64-uwp"
          if errorlevel 1 exit /b 1
          cmake --build --preset uwp-game-dll-release
          if errorlevel 1 exit /b 1
          cmake --preset uwp-package-release
          if errorlevel 1 exit /b 1
          cmake --build --preset uwp-package-release
          if errorlevel 1 exit /b 1

      - name: Verify compiled French content and embedded glyphs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = "$env:GITHUB_WORKSPACE\sm64ex-src\ports\uwp\build-game-dll\sm64ex_game.dll"
          if (!(Test-Path $dll)) { throw "sm64ex_game.dll missing." }
          [byte[]]$data = [System.IO.File]::ReadAllBytes($dll)
          $hex = ([System.BitConverter]::ToString($data)).Replace("-", "")
          foreach ($needle in @(
            "0B0A1D0A1215150E9E0D0E9E0B180B9F18160B",
            "12312635323C24252F28F2",
            "1F120D0E"
          )) {
            if (-not $hex.Contains($needle)) { throw "French text pattern missing: $needle" }
          }
          $ascii = [System.Text.Encoding]::ASCII.GetString($data)
          foreach ($name in @(
            "__sm64ex_fr_accent_grave",
            "__sm64ex_fr_accent_acute",
            "__sm64ex_fr_accent_circumflex",
            "__sm64ex_fr_accent_umlaut",
            "__sm64ex_fr_accent_cedilla",
            "textures/segment2/segment2.03E00.rgba16"
          )) {
            if (-not $ascii.Contains($name)) { throw "Embedded glyph key missing: $name" }
          }

      - name: Repack as 1.0.0.8 and sign
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "deliverable"
          New-Item -ItemType Directory -Force $out | Out-Null

          $built = Get-ChildItem "$env:GITHUB_WORKSPACE\sm64ex-src\ports\uwp\build-package" -Recurse -File |
            Where-Object { $_.Extension -in ".msix", ".appx" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $built) { throw "No package produced." }

          $makeappx = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -File |
            Where-Object { $_.FullName -match "\\x64\\makeappx\.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -File |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $makeappx -or -not $signtool) { throw "Windows SDK packaging tools missing." }

          $unpack = Join-Path $env:GITHUB_WORKSPACE "repack"
          New-Item -ItemType Directory -Force $unpack | Out-Null
          & $makeappx unpack /p $built.FullName /d $unpack /o
          if ($LASTEXITCODE -ne 0) { throw "Unpack failed." }

          [xml]$manifest = Get-Content (Join-Path $unpack "AppxManifest.xml")
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("f", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $identity = $manifest.SelectSingleNode("/f:Package/f:Identity", $ns)
          if (-not $identity) { throw "Identity missing." }
          $identity.Version = "1.0.0.8"

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create((Join-Path $unpack "AppxManifest.xml"), $settings)
          $manifest.Save($writer)
          $writer.Close()

          Remove-Item (Join-Path $unpack "AppxSignature.p7x") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $unpack "AppxBlockMap.xml") -Force -ErrorAction SilentlyContinue

          $dest = Join-Path $out "sm64ex-uwp-NTSC-FR_1.0.0.8_x64.msix"
          & $makeappx pack /d $unpack /p $dest /o
          if ($LASTEXITCODE -ne 0) { throw "Pack failed." }

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Caorthann" -KeyUsage DigitalSignature -FriendlyName "sm64ex NTSC-FR v8" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $passText = [Guid]::NewGuid().ToString("N")
          $pass = ConvertTo-SecureString -String $passText -Force -AsPlainText
          $pfx = Join-Path $out "temporary-signing.pfx"
          $cer = Join-Path $out "sm64ex-NTSC-FR-1.0.0.8.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          & $signtool sign /fd SHA256 /f $pfx /p $passText $dest
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }
          Remove-Item $pfx -Force

          Get-FileHash $dest -Algorithm SHA256 | Format-List | Out-File (Join-Path $out "SHA256.txt")
          @(
            "SM64ex NTSC-FR 1.0.0.8",
            "",
            "Install over the previous NTSC-FR build.",
            "Keep your current E:\sm64ex\res\base.zip; no replacement is required.",
            "HUD V and the five French accent glyphs are embedded in the UWP DLL.",
            "Accent bitmaps are stored in the native 16x8 source orientation used before TextureRectangleFlip."
          ) | Set-Content (Join-Path $out "README_INSTALL_FR.txt") -Encoding utf8

      - name: Upload v8 package
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-uwp-NTSC-FR-1.0.0.8
          path: deliverable/*
          if-no-files-found: error
