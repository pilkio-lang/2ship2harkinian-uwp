name: Repack verified sm64ex FR as 1.0.0.2

on:
  push:
    branches:
      - chatgpt-sm64ex-fr-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: windows-2022
    steps:
      - name: Download verified French build
        uses: actions/download-artifact@v4
        with:
          name: sm64ex-uwp-NTSC-FR-1.0.0.1
          path: input
          github-token: ${{ github.token }}
          run-id: 36267785114

      - name: Repack and sign 1.0.0.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-ChildItem "$env:GITHUB_WORKSPACE\input" -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $src) { throw "Verified source MSIX was not found." }

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -File |
            Where-Object { $_.FullName -match "\\x64\\makeappx\.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "MakeAppx was not found." }
          $makeappx = $sdk.FullName
          $signtool = Join-Path $sdk.Directory.FullName "signtool.exe"
          if (-not (Test-Path $signtool)) { throw "SignTool was not found." }

          $work = Join-Path $env:GITHUB_WORKSPACE "package"
          $out = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force $out | Out-Null

          & $makeappx unpack /p $src.FullName /d $work /o
          if ($LASTEXITCODE -ne 0) { throw "Unpack failed." }

          [xml]$manifest = Get-Content (Join-Path $work "AppxManifest.xml")
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("f", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $identity = $manifest.SelectSingleNode("/f:Package/f:Identity", $ns)
          if (-not $identity) { throw "Identity node not found." }
          $identity.Version = "1.0.0.2"

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create((Join-Path $work "AppxManifest.xml"), $settings)
          $manifest.Save($writer)
          $writer.Close()

          Remove-Item (Join-Path $work "AppxSignature.p7x") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $work "AppxBlockMap.xml") -Force -ErrorAction SilentlyContinue

          $dest = Join-Path $out "sm64ex-uwp-NTSC-FR_1.0.0.2_x64.msix"
          & $makeappx pack /d $work /p $dest /o
          if ($LASTEXITCODE -ne 0) { throw "Pack failed." }

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Caorthann" -KeyUsage DigitalSignature -FriendlyName "sm64ex NTSC-FR 1.0.0.2" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath (Join-Path $out "sm64ex-NTSC-FR-1.0.0.2.cer") | Out-Null

          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $dest
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }

          Get-FileHash $dest -Algorithm SHA256 | Format-List | Out-File (Join-Path $out "SHA256.txt")

      - name: Upload 1.0.0.2
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-uwp-NTSC-FR-1.0.0.2
          path: out/*
          if-no-files-found: error
