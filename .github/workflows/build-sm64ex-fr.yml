name: Build sm64ex NTSC-FR UWP

on:
  push:
    branches:
      - chatgpt-sm64ex-fr-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build helper branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-sm64ex-fr-build

      - name: Clone pinned sm64ex UWP source
        shell: pwsh
        run: |
          git clone https://github.com/caorthann-celt/sm64ex-uwp.git "$env:GITHUB_WORKSPACE\sm64ex"
          Set-Location "$env:GITHUB_WORKSPACE\sm64ex"
          git checkout a0b33a006b0204d8fc837fa760a19135148c96bc
          git apply "$env:GITHUB_WORKSPACE\ci\sm64ex-ntsc-fr.patch"
          git apply "$env:GITHUB_WORKSPACE\ci\sm64ex-ntsc-fr-extra.patch"
          git diff --check

      - name: Prepare MSYS2 tools
        shell: pwsh
        run: |
          $bash = "C:\msys64\usr\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "MSYS2 not found at C:\msys64" }
          & $bash -lc "pacman -S --needed --noconfirm make gcc python git"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 package install failed" }

          $srcWin = "$env:GITHUB_WORKSPACE\sm64ex"
          $srcMsys = (& "C:\msys64\usr\bin\cygpath.exe" -u $srcWin).Trim()
          & $bash -lc "cd '$srcMsys' && make -C tools textconv"
          if ($LASTEXITCODE -ne 0) { throw "textconv build failed" }

      - name: Install SDL2 UWP via vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (!$vcpkgRoot) {
            if (Test-Path "C:\vcpkg\vcpkg.exe") { $vcpkgRoot = "C:\vcpkg" }
            else { throw "vcpkg not found" }
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install sdl2:x64-uwp --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg SDL2 UWP install failed" }

      - name: Build modified sm64ex_game.dll
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -app_platform=UWP
          if errorlevel 1 exit /b 1
          set VCPKG_ROOT=%VCPKG_ROOT%
          cd /d "%GITHUB_WORKSPACE%\sm64ex\ports\uwp"
          cmake --preset uwp-game-dll-release -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DSM64EX_VCPKG_ROOT="%VCPKG_ROOT%" -DSM64EX_SDL2_ROOT="%VCPKG_ROOT%\installed\x64-uwp"
          if errorlevel 1 exit /b 1
          cmake --build --preset uwp-game-dll-release
          if errorlevel 1 exit /b 1
          dir build-game-dll\sm64ex_game.dll

      - name: Repack original UWP with French DLL
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64" } |
            Where-Object { Test-Path (Join-Path $_ "makeappx.exe") } |
            Select-Object -First 1
          if (!$sdkBin) { throw "Windows SDK MakeAppx/SignTool not found" }
          $makeappx = Join-Path $sdkBin "makeappx.exe"
          $signtool = Join-Path $sdkBin "signtool.exe"

          $out = "$env:GITHUB_WORKSPACE\out"
          $pkg = Join-Path $out "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $original = Join-Path $out "sm64ex-original.msix"
          Invoke-WebRequest -Uri "https://github.com/caorthann-celt/sm64ex-uwp/releases/download/v1.0.0.0/sm64ex-uwp-udd_1.0.0.0_x64.msix" -OutFile $original

          & $makeappx unpack /p $original /d $pkg /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx unpack failed" }

          Copy-Item "$env:GITHUB_WORKSPACE\sm64ex\ports\uwp\build-game-dll\sm64ex_game.dll" (Join-Path $pkg "sm64ex_game.dll") -Force

          $manifest = Join-Path $pkg "AppxManifest.xml"
          $xml = Get-Content $manifest -Raw
          $xml = $xml -replace 'Version="1\.0\.0\.0"', 'Version="1.0.0.1"'
          Set-Content -LiteralPath $manifest -Value $xml -Encoding UTF8

          Remove-Item (Join-Path $pkg "AppxSignature.p7x") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg "AppxBlockMap.xml") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg "[Content_Types].xml") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg "AppxMetadata\CodeIntegrity.cat") -Force -ErrorAction SilentlyContinue

          $final = Join-Path $out "sm64ex-uwp-NTSC-FR_1.0.0.1_x64.msix"
          & $makeappx pack /d $pkg /p $final /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx pack failed" }

          $passwordText = "sm64ex-fr-build"
          $password = ConvertTo-SecureString -String $passwordText -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Caorthann" -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}") -FriendlyName "sm64ex NTSC-FR Dev Cert" -NotAfter (Get-Date).AddYears(3)
          Export-PfxCertificate -Cert $cert -FilePath (Join-Path $out "sm64ex-NTSC-FR-devcert.pfx") -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $out "sm64ex-NTSC-FR-devcert.cer") | Out-Null

          & $signtool sign /fd SHA256 /a /f (Join-Path $out "sm64ex-NTSC-FR-devcert.pfx") /p $passwordText $final
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed" }
          & $signtool verify /pa /v $final
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed" }

          Remove-Item (Join-Path $out "sm64ex-NTSC-FR-devcert.pfx") -Force
          @"
sm64ex UWP NTSC-FR 1.0.0.1

- Package identity: sm64ex.uwp
- Publisher: CN=Caorthann
- Architecture: x64
- Keeps the NTSC-US UWP build and external US base.zip
- French text layer enabled
- Signed with a new self-signed development certificate (included as .cer)

Try installing the MSIX over 1.0.0.0 first. If Xbox rejects the update because the signing certificate changed, uninstall 1.0.0.0 and install this build fresh. Your external E:\sm64ex assets remain separate from the app package.
"@ | Set-Content (Join-Path $out "README_INSTALL.txt") -Encoding UTF8

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-uwp-NTSC-FR-1.0.0.1
          path: |
            out/sm64ex-uwp-NTSC-FR_1.0.0.1_x64.msix
            out/sm64ex-NTSC-FR-devcert.cer
            out/README_INSTALL.txt
          if-no-files-found: error
