name: Build sm64ex NTSC-FR clean v5

on:
  push:
    branches:
      - chatgpt-sm64ex-fr-v5-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-sm64ex-fr-v5-clean

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang

      - name: Record MSYS2 root
        shell: msys2 {0}
        run: |
          root="$(cygpath -w / | tr '\\' '/')"
          echo "SM64EX_MSYS2_ROOT=$root" >> "$GITHUB_ENV"

      - name: Fetch pinned UWP source and apply clean French renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone https://github.com/caorthann-celt/sm64ex-uwp.git sm64ex-src
          if ($LASTEXITCODE -ne 0) { throw "Clone failed." }

          Set-Location sm64ex-src
          git checkout a0b33a006b0204d8fc837fa760a19135148c96bc
          if ($LASTEXITCODE -ne 0) { throw "Pinned source checkout failed." }

          python "$env:GITHUB_WORKSPACE\ci\apply-sm64ex-fr-v5-clean.py" "$PWD"
          if ($LASTEXITCODE -ne 0) { throw "French transform failed." }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed." }

          if (-not (Select-String -Path "ports\uwp\CMakeLists.txt" -Pattern 'SM64EX_FRENCH_RENDERER=1' -Quiet)) {
            throw "French renderer macro is not enabled."
          }
          if (-not (Select-String -Path "bin\segment2.c" -Pattern 'text/fr/define_text.inc.c' -Quiet)) {
            throw "French text table is not selected."
          }
          if (-not (Select-String -Path "src\game\ingame_menu.c" -Pattern 'handle_dialog_text_and_pages_fr' -Quiet)) {
            throw "EU-style French dialog renderer is missing."
          }
          if (Select-String -Path "src\game\ingame_menu.c" -Pattern 'print_generic_string_fr_us' -Quiet) {
            throw "Old v4 absolute renderer survived unexpectedly."
          }

      - name: Build text converter
        shell: msys2 {0}
        working-directory: sm64ex-src
        run: |
          make -C tools textconv
          test -f tools/textconv.exe || cp tools/textconv tools/textconv.exe

      - name: Install SDL2 UWP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT = "C:\vcpkg"
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          & "$env:VCPKG_ROOT\vcpkg.exe" install sdl2:x64-uwp
          if ($LASTEXITCODE -ne 0) { throw "SDL2 UWP install failed." }
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build UWP game DLL and package
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -app_platform=UWP
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=C:\vcpkg"
          cd /d "%GITHUB_WORKSPACE%\sm64ex-src\ports\uwp"
          cmake --preset uwp-game-dll-release -DSM64EX_MSYS2_ROOT="%SM64EX_MSYS2_ROOT%" -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DSM64EX_VCPKG_ROOT="C:/vcpkg" -DSM64EX_SDL2_ROOT="C:/vcpkg/installed/x64-uwp"
          if errorlevel 1 exit /b 1
          cmake --build --preset uwp-game-dll-release
          if errorlevel 1 exit /b 1
          cmake --preset uwp-package-release
          if errorlevel 1 exit /b 1
          cmake --build --preset uwp-package-release
          if errorlevel 1 exit /b 1

      - name: Verify compiled French binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = "$env:GITHUB_WORKSPACE\sm64ex-src\ports\uwp\build-game-dll\sm64ex_game.dll"
          $frText = "$env:GITHUB_WORKSPACE\sm64ex-src\ports\uwp\build-game-dll\generated\us_pc\text\fr\define_text.inc.c"

          if (!(Test-Path $dll)) { throw "sm64ex_game.dll missing." }
          if (!(Test-Path $frText)) { throw "Generated French text table missing." }

          [byte[]]$data = [System.IO.File]::ReadAllBytes($dll)
          $hex = ([System.BitConverter]::ToString($data)).Replace("-", "")

          foreach ($needle in @(
            "0B0A1D0A1215150E9E0D0E9E0B180B9F18160B",
            "12312635323C24252F28F2",
            "1F120D0E"
          )) {
            if (-not $hex.Contains($needle)) { throw "French byte pattern missing: $needle" }
          }

          $ascii = [System.Text.Encoding]::ASCII.GetString($data)
          if (-not $ascii.Contains("SM64EX_FRENCH_RENDERER")) {
            Write-Host "Macro names are normally stripped from release DLLs; continuing."
          }

      - name: Repack as 1.0.0.5 and sign
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "deliverable"
          New-Item -ItemType Directory -Force $out | Out-Null

          $built = Get-ChildItem "$env:GITHUB_WORKSPACE\sm64ex-src\ports\uwp\build-package" -Recurse -File |
            Where-Object { $_.Extension -in ".msix", ".appx" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $built) { throw "No MSIX/AppX package was produced." }

          $makeappxItem = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -File |
            Where-Object { $_.FullName -match "\\x64\\makeappx\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $signtoolItem = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -File |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeappxItem -or -not $signtoolItem) { throw "Windows SDK packaging tools missing." }

          $unpack = Join-Path $env:GITHUB_WORKSPACE "repack"
          if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
          New-Item -ItemType Directory -Force $unpack | Out-Null

          & $makeappxItem.FullName unpack /p $built.FullName /d $unpack /o
          if ($LASTEXITCODE -ne 0) { throw "Unpack failed." }

          [xml]$manifest = Get-Content (Join-Path $unpack "AppxManifest.xml")
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("f", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $identity = $manifest.SelectSingleNode("/f:Package/f:Identity", $ns)
          if (-not $identity) { throw "Identity node missing." }
          $identity.Version = "1.0.0.5"

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create((Join-Path $unpack "AppxManifest.xml"), $settings)
          $manifest.Save($writer)
          $writer.Close()

          Remove-Item (Join-Path $unpack "AppxSignature.p7x") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $unpack "AppxBlockMap.xml") -Force -ErrorAction SilentlyContinue

          $dest = Join-Path $out "sm64ex-uwp-NTSC-FR_1.0.0.5_x64.msix"
          & $makeappxItem.FullName pack /d $unpack /p $dest /o
          if ($LASTEXITCODE -ne 0) { throw "Pack failed." }

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Caorthann" -KeyUsage DigitalSignature -FriendlyName "sm64ex NTSC-FR clean v5" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $pwdText = "sm64ex-fr-build"
          $pwd = ConvertTo-SecureString -String $pwdText -Force -AsPlainText
          $pfx = Join-Path $out "signing.pfx"
          $cer = Join-Path $out "sm64ex-NTSC-FR-1.0.0.5.cer"

          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          & $signtoolItem.FullName sign /fd SHA256 /f $pfx /p $pwdText $dest
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }

          Remove-Item $pfx -Force
          Get-FileHash $dest -Algorithm SHA256 | Format-List | Out-File (Join-Path $out "SHA256.txt")

          @(
            "SM64ex NTSC-FR clean 1.0.0.5",
            "",
            "Install directly over 1.0.0.4.",
            "Keep the existing E:\sm64ex\res\base.zip.",
            "No companion asset pack is required.",
            "Gameplay/runtime remains VERSION_US; only French text rendering is replaced."
          ) | Set-Content (Join-Path $out "README_INSTALL_FR.txt") -Encoding utf8

      - name: Upload clean package
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-uwp-NTSC-FR-clean-1.0.0.5
          path: deliverable/*
          if-no-files-found: error
